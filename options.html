<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pi-hole Monitor — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      font-size: 14px;
      padding: 40px;
      min-height: 100vh;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #cba6f7;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6c7086;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      max-width: 420px;
      padding: 9px 12px;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 7px;
      color: #cdd6f4;
      font-size: 13px;
      outline: none;
    }

    input:focus {
      border-color: #cba6f7;
    }

    input::placeholder {
      color: #45475a;
    }

    .hint {
      margin-top: 5px;
      font-size: 11px;
      color: #45475a;
    }

    button {
      margin-top: 8px;
      padding: 9px 22px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #d0b4f9; }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #a6e3a1;
      min-height: 18px;
    }

    #status.error { color: #f38ba8; }
  </style>
</head>
<body>
  <h1>Pi-hole Monitor Settings</h1>

  <div class="field">
    <label>Pi-hole IP Address</label>
    <input type="text" id="piholeIp" placeholder="192.168.0.3" autocomplete="off">
  </div>

  <div class="field">
    <label>API Token</label>
    <input type="password" id="piholeToken" placeholder="Paste your API token" autocomplete="off">
    <p class="hint">Found at Pi-hole Admin → Settings → API / Web interface → Show API token</p>
  </div>

  <button id="save-btn">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
